// ═══════════════════════════════════════
//  原图复制图层（v2.4）—— 操作函数
// ═══════════════════════════════════════
function createCopyLayer() {
  if (!S.img) return;
  if (S.copyLayer) { toast('图层已存在，可直接调整'); return; }
  // 图片已裁剪时，图层中心对齐裁剪区中心（整图叠上去刚好与底图重合，无需错开）
  const T = S.imgTrans;
  const baseCx = T.crop ? T.crop.sx + T.crop.sw / 2 : S.imgW / 2;
  const baseCy = T.crop ? T.crop.sy + T.crop.sh / 2 : S.imgH / 2;
  const off = T.crop ? 0 : Math.max(16, Math.min(S.imgW, S.imgH) * 0.04);  // 未裁剪时错开一点，方便看出图层
  S.copyLayer = {
    cx: baseCx + off,
    cy: baseCy + off,
    angle: 0,
    scale: 1,
    transparency: 0,   // 默认完全不透明（0=不透明，越高越透）
    visible: true,
  };
  draw();
  updateSidebar();
  toast('🪞 图层已创建：图内拖动=移动，顶部○圆点=旋转');
}

function removeCopyLayer() {
  if (!S.copyLayer) return;
  S.copyLayer = null;
  S.dragMode = null;
  S.cropMode = false;
  S.cropRect = null;
  draw();
  updateSidebar();
  toast('🗑 复制图层已移除');
}

function toggleLayerVisible() {
  if (!S.copyLayer) return;
  S.copyLayer.visible = !S.copyLayer.visible;
  draw();
  updateSidebar();
}

function resetLayerAlign() {
  if (!S.copyLayer) return;
  const L = S.copyLayer;
  L.cx = S.imgW / 2; L.cy = S.imgH / 2;
  L.angle = 0; L.scale = 1;
  L.transparency = 0; L.visible = true;
  S.dragMode = null;
  draw();
  updateSidebar();
  toast('↺ 图层已复位（居中、不旋转、原大小）');
}

function normalizeLayerAngle() {
  const L = S.copyLayer;
  if (!L) return;
  while (L.angle > Math.PI) L.angle -= 2 * Math.PI;
  while (L.angle < -Math.PI) L.angle += 2 * Math.PI;
}

function setLayerAngle(v) {
  if (!S.copyLayer) return;
  S.copyLayer.angle = parseInt(v) * Math.PI / 180;
  normalizeLayerAngle();
  draw();
  updateLayerDisplays();
}

function setLayerScale(v) {
  if (!S.copyLayer) return;
  S.copyLayer.scale = Math.max(0.1, Math.min(20, (parseInt(v) || 100) / 100));
  draw();
  updateLayerDisplays();
}

function setLayerTransparency(v) {
  if (!S.copyLayer) return;
  S.copyLayer.transparency = Math.max(0, Math.min(1, (parseInt(v) || 0) / 100));
  draw();
  updateLayerDisplays();
}

// ── 裁剪（v2.4） ──
function enterCropMode() {
  if (!S.copyLayer) return;
  S.cropMode = true;
  S.cropRect = null;
  S.dragMode = null;
  draw();
  updateSidebar();
  toast('✂️ 在图上拖动框选要保留的区域');
}

function cancelCropMode() {
  S.cropMode = false;
  S.cropRect = null;
  S.dragMode = null;
  draw();
  updateSidebar();
}

function confirmCrop() {
  const r = S.cropRect;
  if (!r || r.w < 12 || r.h < 12) { toast('✂️ 请先在图上拖动框选区域'); return; }
  const L = S.copyLayer;
  const srcW = L.crop ? L.crop.sw : S.imgW;
  const srcH = L.crop ? L.crop.sh : S.imgH;
  const srcX = L.crop ? L.crop.sx : 0;
  const srcY = L.crop ? L.crop.sy : 0;
  // 框选在图层局部坐标：局部(0,0)=内容中心 → 源图坐标
  L.crop = {
    sx: srcX + r.x + srcW / 2,
    sy: srcY + r.y + srcH / 2,
    sw: r.w,
    sh: r.h,
  };
  // 图层中心移到框选中心（图层自己的角度、大小、透明度保持不变），裁剪块正好留在框的位置
  const rc = { x: r.x + r.w / 2, y: r.y + r.h / 2 };
  const cos = Math.cos(L.angle), sin = Math.sin(L.angle);
  L.cx += (rc.x * cos - rc.y * sin) * L.scale;
  L.cy += (rc.x * sin + rc.y * cos) * L.scale;
  S.cropMode = false;
  S.cropRect = null;
  S.dragMode = null;
  draw();
  updateSidebar();
  toast('✅ 已裁剪：图层只保留框选区域');
}

function clearCrop() {
  if (!S.copyLayer) return;
  S.copyLayer.crop = null;
  draw();
  updateSidebar();
  toast('↺ 图层已恢复整图内容');
}

//  图像调整（v2.4 第二步）—— 裁剪/旋转/视图缩放

function enterImgCropMode() {

function confirmImgCrop() {

  S.imgTrans.crop = { sx: r.x, sy: r.y, sw: r.w, sh: r.h };

  fitImage();

function clearImgCrop() {

  fitImage();
  draw();
  updateSidebar();
  toast('↺ 已恢复整图');
}

function normalizeImgAngle() {
  const T = S.imgTrans;
  while (T.angle > Math.PI) T.angle -= 2 * Math.PI;
  while (T.angle < -Math.PI) T.angle += 2 * Math.PI;
}

function setImgAngle(v) {
  S.imgTrans.angle = (parseInt(v) || 0) * Math.PI / 180;
  normalizeImgAngle();
  draw();
  updateImgDisplays();
}

function resetImgAngle() {
  S.imgTrans.angle = 0;
  draw();
  updateSidebar();
  toast('↺ 图片旋转已复位');
}

// 第二步底部常驻的下一步入口：没划范围时给提示
function tryNextStep() {
  if (S.sqW <= 0 && S.sqH <= 0) { toast('⚠️ 请先在户型图上点击拖动，划定范围'); return; }
  goToStep(3);
}

// 视图缩放滑杆：以「适应窗口」为 100%，绕画布中心缩放
function setViewZoomPct(v) {
  const pct = Math.max(10, Math.min(800, parseInt(v) || 100));
  const newScale = fitScale() * pct / 100;
  const ratio = newScale / S.vScale;
  const ccx = els.canvas.width / window.devicePixelRatio / 2;
  const ccy = els.canvas.height / window.devicePixelRatio / 2;
  S.vx = ccx - (ccx - S.vx) * ratio;
  S.vy = ccy - (ccy - S.vy) * ratio;
  S.vScale = newScale;
  draw();
  const disp = document.getElementById('zoom-display');
  if (disp) disp.textContent = Math.round(pct) + '%';
}

// 第二步侧栏图像调整显示的实时刷新
function updateImgDisplays() {
  const deg = Math.round(S.imgTrans.angle * 180 / Math.PI);
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  const setv = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
  set('img-angle-display', (deg > 0 ? '+' : '') + deg + '°');
  setv('img-angle-num', deg);
  setv('img-angle-range', deg);
}

// 第三步侧栏里图层参数显示与滑杆/数值框的实时同步
function updateLayerDisplays() {
  const L = S.copyLayer;
  if (!L) return;
  const R = Math.round(L.angle * 180 / Math.PI);   // −180 ~ 180
  const scalePct = Math.round(L.scale * 100);
  const trPct = Math.round(L.transparency * 100);
  const set = (id, txt) => { const el = document.getElementById(id); if (el) el.textContent = txt; };
  const setv = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
  set('ly-angle-display', (R > 0 ? '+' : '') + R + '°');
  set('ly-scale-display', scalePct + '%');
  set('ly-tr-display', trPct + '%');
  setv('ly-angle-num', R);
  setv('ly-angle-range', R);
  setv('ly-scale-num', scalePct);
  setv('ly-scale-range', scalePct);
  setv('ly-tr-num', trPct);
  setv('ly-tr-range', trPct);
}

let toastTimer;
function toast(msg) {
  const t = els.toast;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
