<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>福音 · 风水户型分析 — 二十四山 v2.4</title>
<style>
  :root {
    --bg: #faf7f0;
    --surface: #f2ecdf;
    --border: #d4c8b0;
    --text: #3d2e1f;
    --text-dim: #8c7b6b;
    --accent: #b52330;
    --accent-glow: #d4303f;
    --gold: #b8942e;
    --step-active: #d4303f;
    --step-done: #4caf84;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── header ── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    z-index: 10;
    flex-shrink: 0;
  }
  #header h1 { font-size: 1.15rem; font-weight: 600; letter-spacing: .04em; flex: 1; }
  #header h1 span { color: var(--accent-glow); }

  #steps {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .step-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .78rem; font-weight: 700;
    background: var(--border);
    color: var(--text-dim);
    transition: all .25s;
  }
  .step-dot.active { background: var(--step-active); color: #fff; box-shadow: 0 0 12px rgba(255,77,106,.5); }
  .step-dot.done { background: var(--step-done); color: #fff; }
  .step-line { width: 28px; height: 2px; background: var(--border); border-radius: 1px; }
  .step-line.done { background: var(--step-done); }

  #header-right { display: flex; gap: 8px; flex: 1; justify-content: flex-end; }
  #steps .step-dot { cursor: pointer; }
  #steps .step-dot:hover { transform: scale(1.12); }
  .step-dot:not(.active):not(.done):hover { background: #c8baa0; color: #fff; }

  /* ── main area ── */
  #main {
    flex: 1;
    display: flex;
    position: relative;
    overflow: hidden;
  }

  #canvas-wrap {
    flex: 1;
    position: relative;
    cursor: crosshair;
    overflow: hidden;
  }
  canvas {
    display: block;
  }

  /* ── sidebar ── */
  #sidebar {
    width: 300px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    flex-shrink: 0;
    z-index: 5;
  }
  #sidebar h3 {
    font-size: .88rem; font-weight: 600; color: var(--accent-glow);
    margin-bottom: 3px; line-height: 1.3;
  }
  #sidebar p.desc {
    font-size: .78rem; color: var(--text-dim); line-height: 1.45;
  }
  /* 大功能区块之间的间距（同一功能内部的组件保持紧凑） */
  .sec { margin-top: 16px; }

  .ctrl-group {
    display: flex; flex-direction: column; gap: 5px;
  }
  .ctrl-group label {
    font-size: .72rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em;
  }
  .ctrl-row {
    display: flex; gap: 6px; align-items: center;
  }

  button {
    padding: 8px 18px;
    border: none; border-radius: 6px;
    font-size: .85rem; font-weight: 600; cursor: pointer;
    transition: all .18s;
    font-family: inherit;
  }
  button.primary {
    background: var(--accent); color: #fff;
  }
  button.primary:hover { background: var(--accent-glow); }
  button.secondary {
    background: var(--border); color: var(--text);
  }
  button.secondary:hover { background: #c8baa0; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  /* ── action buttons (uniform width, icon+text inline) ── */
  .btn-act {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 7px 10px;
    min-height: 34px;
    font-size: .8rem;
    font-weight: 600;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all .2s;
    font-family: inherit;
    flex: 1 1 0;
    max-width: 180px;
    white-space: nowrap;
  }
  .btn-act .arr { font-size: 1em; opacity: .85; }

  input[type=range] {
    width: 100%; accent-color: var(--accent);
  }
  input[type=number] {
    width: 62px; padding: 4px 6px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    font-size: .8rem; text-align: center; font-family: inherit;
  }

  .info-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: .78rem;
    line-height: 1.5;
  }
  .info-card .val { color: var(--accent-glow); font-weight: 700; }

  /* ── legend ── */
  #legend { margin-top: auto; }
  #legend .grid-mini {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 2px;
    margin-top: 6px;
  }
  #legend .cell-mini {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: .7rem; font-weight: 600;
    border-radius: 3px;
    flex-direction: column;
    line-height: 1.2;
  }

  /* ── upload overlay ── */
  #upload-overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
    background: rgba(60,40,20,.45);
    z-index: 20;
  }
  #upload-overlay.opaque { background: var(--bg); }
  #upload-box {
    background: var(--surface);
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 48px 56px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s;
  }
  #upload-box:hover { border-color: var(--accent-glow); }
  #upload-box h2 { margin-bottom: 8px; }
  #upload-box p { color: var(--text-dim); font-size: .85rem; }

  /* ── toast ── */
  #toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: var(--surface); color: var(--text);
    padding: 10px 24px; border-radius: 20px;
    font-size: .82rem; border: 1px solid var(--border);
    opacity: 0; transition: opacity .3s;
    pointer-events: none; z-index: 99;
  }
  #toast.show { opacity: 1; }

  /* ── history modal ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(60,40,20,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: min(560px, 92vw);
    max-height: 82vh;
    display: flex; flex-direction: column;
    box-shadow: 0 12px 40px rgba(40,25,10,.35);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .modal-head h2 { font-size: 1.05rem; }
  #history-list {
    overflow-y: auto;
    padding: 12px 18px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .hist-item {
    display: flex; gap: 12px; align-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
  }
  .hist-thumb {
    width: 72px; height: 54px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: #fff;
    flex-shrink: 0;
  }
  .hist-thumb-empty { background: var(--surface); }
  .hist-info { flex: 1; min-width: 0; }
  .hist-name {
    font-weight: 600; font-size: .85rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .hist-meta { font-size: .72rem; color: var(--text-dim); margin: 3px 0 7px; }
  .hist-actions { display: flex; gap: 6px; }
  .hist-actions button { padding: 4px 10px; font-size: .72rem; }
  button.danger { background: #f0dcd6; color: #7a1a10; }
  button.danger:hover { background: #e4c6bc; }
  .hist-empty { font-size: .82rem; color: var(--text-dim); text-align: center; padding: 24px 0; line-height: 1.6; }

  /* compact history items inside the step-1 sidebar */
  #sidebar .hist-item { padding: 8px; }
  #sidebar .hist-thumb { width: 56px; height: 42px; }
  #sidebar .hist-actions { flex-wrap: wrap; }
  #sidebar .hist-actions button { padding: 3px 8px; font-size: .68rem; }
  #sidebar .hist-meta { margin: 2px 0 5px; }
  .modal-foot {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  @media (max-width: 768px) {
    #main { flex-direction: column; }
    #sidebar { width: 100%; max-height: 220px; flex-shrink: 0; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <h1>🏠 福音 · 风水户型分析 <span style="font-size:.65rem;color:var(--text-dim);font-weight:400;margin-left:6px">v2.4</span></h1>
  <div id="steps">
    <div class="step-dot active" id="sd0" title="1 · 上传户型图">1</div>
    <div class="step-line" id="sl0"></div>
    <div class="step-dot" id="sd1" title="2 · 划定户型范围">2</div>
    <div class="step-line" id="sl1"></div>
    <div class="step-dot" id="sd2" title="3 · 标记正北方">3</div>
    <div class="step-line" id="sl2"></div>
    <div class="step-dot" id="sd3" title="4 · 二十四山罗盘">4</div>
    <div class="step-line" id="sl3"></div>
    <div class="step-dot" id="sd4" title="5 · 标记问题山向">5</div>
    <div class="step-line" id="sl4"></div>
    <div class="step-dot" id="sd5" title="6 · 汇总报告">6</div>
  </div>
  <div id="header-right">
    <button class="secondary" style="padding:6px 12px;font-size:.78rem" onclick="saveSnapshot()" title="保存当前进度为存档">💾 保存</button>
    <button class="secondary" style="padding:6px 12px;font-size:.78rem" onclick="showHistoryModal()" title="查看历史存档">📂 历史</button>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>

    <!-- UPLOAD OVERLAY (step 1) — scoped to canvas so the sidebar stays usable -->
    <div id="upload-overlay">
      <div id="upload-box">
        <h2>📐 上传户型图</h2>
        <p>支持 JPG / PNG 格式，点击或拖拽上传</p>
        <input type="file" id="file-input" accept="image/jpeg,image/png" hidden>
      </div>
      <button id="upload-cancel" class="secondary" style="display:none" onclick="cancelUpload()">← 取消，返回当前进度</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-content"></div>
  </div>
</div>

<!-- HISTORY MODAL -->
<div id="history-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-head">
      <h2>📂 历史存档</h2>
      <button class="secondary" style="padding:5px 12px;font-size:.75rem" onclick="hideHistoryModal()">✕ 关闭</button>
    </div>
    <div id="history-list"></div>
    <div class="modal-foot">
      <button class="secondary" onclick="hideHistoryModal()">继续当前进度</button>
      <button class="primary" onclick="startNewAnalysis()">➕ 开始新分析</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════
const BAGUA = [
  // row, col, name, trigram, direction, luoshuNum
  [0,0,'乾','☰','西北',6],
  [0,1,'坎','☵','正北',1],
  [0,2,'艮','☶','东北',8],
  [1,0,'兑','☱','正西',7],
  [1,1,'中宫','','中央',5],
  [1,2,'震','☳','正东',3],
  [2,0,'坤','☷','西南',2],
  [2,1,'离','☲','正南',9],
  [2,2,'巽','☴','东南',4],
];

// Five-element (五行) mapping for each Bagua trigram
const WUXING = {
  '乾':'金','兑':'金',
  '坎':'水',
  '震':'木','巽':'木',
  '离':'火',
  '坤':'土','艮':'土','中宫':'土',
};
const ELEMENT_BG = {
  '金':'#f2eee6', '水':'#dce4f0', '木':'#d8e8d8',
  '火':'#f0dcd6', '土':'#ece0cc',
};
const ELEMENT_TEXT = {
  '金':'#4a3828', '水':'#102850', '木':'#1a3a12',
  '火':'#7a1a10', '土':'#4a3020',
};
const ELEMENT_PLATE = {
  '金':'rgba(0,0,0,0.28)', '水':'rgba(15,50,90,0.11)',
  '木':'rgba(25,60,15,0.10)', '火':'rgba(120,30,0,0.11)',
  '土':'rgba(60,40,20,0.11)',
};

// Detailed Bagua reference — nature, family role, meaning
const BAGUA_DETAIL = {
  '坎':{nature:'水/月',family:'中男',meaning:'智慧、险阻',trait:'陷',animal:'猪',bodyPart:'耳'},
  '艮':{nature:'山',family:'少男',meaning:'止息、稳健',trait:'止',animal:'狗',bodyPart:'手'},
  '震':{nature:'雷',family:'长男',meaning:'功名、起步',trait:'动',animal:'龙',bodyPart:'足'},
  '巽':{nature:'风',family:'长女',meaning:'文昌、钱财',trait:'入',animal:'鸡',bodyPart:'股'},
  '离':{nature:'火/日',family:'中女',meaning:'声誉、礼节',trait:'丽',animal:'雉',bodyPart:'目'},
  '坤':{nature:'地',family:'母亲',meaning:'女主、健康',trait:'顺',animal:'牛',bodyPart:'腹'},
  '兑':{nature:'泽/雨',family:'少女',meaning:'妾位、口舌',trait:'悦',animal:'羊',bodyPart:'口'},
  '乾':{nature:'天',family:'父亲',meaning:'男主、贵人',trait:'健',animal:'马',bodyPart:'首'},
  '中宫':{nature:'—',family:'—',meaning:'家运总枢纽、阴阳平衡点',trait:'—',animal:'—',bodyPart:'—'},
};

// Five-element emoji with yin-yang distinction
const ELEMENT_EMOJI = {
  '乾':'🥇','兑':'💍',  // 金: 阳/阴
  '离':'🔥',              // 火
  '震':'🌳','巽':'🌿',  // 木: 阳/阴
  '坎':'💧',              // 水
  '艮':'⛰️','坤':'🏔️',  // 土: 阳/阴
  '中宫':'🏠',
};

// Twenty-Four Mountains (二十四山) — 15° sectors clockwise from North
const MOUNTAINS_24 = [
  // name, trigram, direction, element, branch, angle(°)
  ['子','坎','北','水','子',0],
  ['癸','坎','北','水','',15],
  ['丑','艮','东北','土','丑',30],
  ['艮','艮','东北','土','',45],
  ['寅','艮','东北','土','寅',60],
  ['甲','震','东','木','',75],
  ['卯','震','东','木','卯',90],
  ['乙','震','东','木','',105],
  ['辰','巽','东南','木','辰',120],
  ['巽','巽','东南','木','',135],
  ['巳','巽','东南','木','巳',150],
  ['丙','离','南','火','',165],
  ['午','离','南','火','午',180],
  ['丁','离','南','火','',195],
  ['未','坤','西南','土','未',210],
  ['坤','坤','西南','土','',225],
  ['申','坤','西南','土','申',240],
  ['庚','兑','西','金','',255],
  ['酉','兑','西','金','酉',270],
  ['辛','兑','西','金','',285],
  ['戌','乾','西北','金','戌',300],
  ['乾','乾','西北','金','',315],
  ['亥','乾','西北','金','亥',330],
  ['壬','坎','北','水','',345],
];

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
const S = {
  step: 1,           // 1=upload, 2=square, 3=north, 4=grid, 5=mark, 6=summary
  markedMountains: new Set(), // Set of MOUNTAINS_24 indices (0-23) marked with ⚠️
  img: null,         // HTMLImageElement
  imgW: 0, imgH: 0,

  // View transform
  vx: 0, vy: 0,      // image top-left on canvas
  vScale: 1,

  // Square 1 (user-defined house area), in image coords
  sqCx: 0, sqCy: 0,  // center (intersection of diagonals)
  sqW: 0, sqH: 0,     // width & height (px) — free aspect ratio
  sqAngle: 0,         // radians, 0 = top edge is horizontal

  // North direction, radians from "up" (image y-negative), CW+
  northAngle: 0,

  // Square 2 (grid), size can differ from sqSize
  gridScale: 1.0,     // 1.0 = 100% = diameter equals rect max side

  // Image opacity for marking mode
  overlayTransparency: 0.9,   // 0=original (opaque), 1=fully transparent; default 90%

  // Compass (罗盘) opacity — independent of overlay
  compassTransparency: 0.1,   // 0=fully opaque, 1=fully transparent; default 10%

  // 原图复制图层（v2.4，第三步起）——把原图再叠一层，可旋转/缩放/平移/调透明度。
  // 用途：同一张图里既有户型图又有整层平面图、北箭头只标在整层图上时，
  // 把图层里的户型轮廓对齐到原图整层平面中的户型位置，即可换算出户型朝向。
  // 图层内容可裁剪：crop={sx,sy,sw,sh} 图像坐标，null=整图。
  copyLayer: null,   // {cx,cy,angle,scale,transparency,visible,crop} | null
                     // cx,cy=图层中心(图像坐标)；angle=顺时针弧度；scale=相对原图倍率(0.1~20)；
                     // transparency=0不透明~1全透明；crop=null整图或裁剪区域

  // 裁剪模式（第二/三步）：框选区域
  cropMode: false,   // true=正在框选/待确认
  cropRect: null,    // {x,y,w,h} 原图像素坐标，待确认的裁剪框

  // 图像调整（v2.4 第二步）：裁剪/旋转原图（非破坏性画布空间变换，状态坐标始终留在原图空间）
  imgTrans: { crop: null, angle: 0 },   // crop={sx,sy,sw,sh} 原图像素坐标；angle=顺时针弧度

  // Persistence (local archive)
  imgBlob: null,              // Blob/File of current image (for IndexedDB)
  thumb: '',                  // small thumbnail dataURL
  autosaveImageStored: false, // whether autosave record already holds current image blob
  uploadOverlayShown: false,  // step-1 overlay shown while a session exists (cancellable)

  // Interaction
  dragMode: null,     // 'move' | 'scale' | 'rotate' | 'north' | 'pan' | 'create'
  dragCorner: -1,     // which corner for scale drag
  dragStart: {x:0,y:0},
  dragState: null,    // snapshot of sq params at drag start

  // Hover
  hoverMode: null,
  hoverCorner: -1,
};

// ═══════════════════════════════════════
//  DOM
// ═══════════════════════════════════════
const els = {
  canvas: document.getElementById('c'),
  wrap: document.getElementById('canvas-wrap'),
  sidebar: document.getElementById('sidebar-content'),
  uploadOverlay: document.getElementById('upload-overlay'),
  uploadBox: document.getElementById('upload-box'),
  uploadCancel: document.getElementById('upload-cancel'),
  fileInput: document.getElementById('file-input'),
  toast: document.getElementById('toast'),
  stepDots: [0,1,2,3,4,5].map(i => document.getElementById('sd'+i)),
  stepLines: [0,1,2,3,4].map(i => document.getElementById('sl'+i)),
};

const ctx = els.canvas.getContext('2d');

// ═══════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════
// ── 图像空间变换（裁剪+旋转，非破坏性） ──
// 原图坐标 → 变换后坐标（裁剪：平移；旋转：绕可见区域中心顺时针）
function imgTransApply(p) {
  const T = S.imgTrans;
  const ox = T.crop ? T.crop.sx : 0;
  const oy = T.crop ? T.crop.sy : 0;
  const cw = T.crop ? T.crop.sw : S.imgW;
  const ch = T.crop ? T.crop.sh : S.imgH;
  const cos = Math.cos(T.angle), sin = Math.sin(T.angle);
  const x = p.x - ox - cw / 2, y = p.y - oy - ch / 2;
  return { x: x * cos - y * sin + cw / 2, y: x * sin + y * cos + ch / 2 };
}
function imgTransApplyInv(p) {
  const T = S.imgTrans;
  const ox = T.crop ? T.crop.sx : 0;
  const oy = T.crop ? T.crop.sy : 0;
  const cw = T.crop ? T.crop.sw : S.imgW;
  const ch = T.crop ? T.crop.sh : S.imgH;
  const cos = Math.cos(-T.angle), sin = Math.sin(-T.angle);
  const x = p.x - cw / 2, y = p.y - ch / 2;
  return { x: x * cos - y * sin + cw / 2 + ox, y: x * sin + y * cos + ch / 2 + oy };
}
// 画布 CTM：设置后即可直接用原图坐标绘制（所有图层/辅助线共用，保证整体一起旋转裁剪）
function applyImgSpace() {
  ctx.translate(S.vx, S.vy);
  ctx.scale(S.vScale, S.vScale);
  const T = S.imgTrans;
  const ox = T.crop ? T.crop.sx : 0;
  const oy = T.crop ? T.crop.sy : 0;
  const cw = T.crop ? T.crop.sw : S.imgW;
  const ch = T.crop ? T.crop.sh : S.imgH;
  ctx.translate(-ox, -oy);
  ctx.translate(cw / 2, ch / 2);
  ctx.rotate(T.angle);
  ctx.translate(-cw / 2, -ch / 2);
}

function img2canvas(ix, iy) {
  const p = imgTransApply({ x: ix, y: iy });
  return { x: p.x * S.vScale + S.vx, y: p.y * S.vScale + S.vy };
}
function canvas2img(cx, cy) {
  const p = imgTransApplyInv({ x: (cx - S.vx) / S.vScale, y: (cy - S.vy) / S.vScale });
  return { x: p.x, y: p.y };
}

function dist(a,b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// 点到线段的距离
function pointSegDist(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1) * dx + (py - y1) * dy) / len2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
}

// Get the 4 corners of a rectangle in image coords
function getCorners(cx, cy, w, h, angle) {
  const hw = w / 2, hh = h / 2;
  const cos = Math.cos(angle), sin = Math.sin(angle);
  const locals = [[hw,hh],[-hw,hh],[-hw,-hh],[hw,-hh]]; // BR, BL, TL, TR
  return locals.map(([lx,ly]) => ({
    x: cx + lx*cos - ly*sin,
    y: cy + lx*sin + ly*cos,
  }));
}

// Get rotation handle position (top edge midpoint)
function getRotHandle(cx, cy, w, h, angle) {
  const hh = h / 2;
  return {
    x: cx + hh * Math.sin(angle),
    y: cy - hh * Math.cos(angle),
  };
}

// Effective size for compass/north-indicator sizing (use max of w,h)
function getRectSize() {
  return Math.max(S.sqW, S.sqH);
}

// ═══════════════════════════════════════
//  HIT TESTING (in image coords)
// ═══════════════════════════════════════
const HANDLE_R = 10;      // handle radius in image px (before scale)
const CORNER_HIT_R = 14;

function hitTestCorner(ix, iy) {
  if (S.step < 2) return -1;
  const corners = getCorners(S.sqCx, S.sqCy, S.sqW, S.sqH, S.sqAngle);
  for (let i = 0; i < 4; i++) {
    if (dist({x:ix,y:iy}, corners[i]) < CORNER_HIT_R / S.vScale) return i;
  }
  return -1;
}

function hitTestRotHandle(ix, iy) {
  if (S.step < 2) return false;
  const rh = getRotHandle(S.sqCx, S.sqCy, S.sqW, S.sqH, S.sqAngle);
  return dist({x:ix,y:iy}, rh) < HANDLE_R / S.vScale;
}

function hitTestSquareBody(ix, iy) {
  if (S.step < 2 || (S.sqW <= 0 && S.sqH <= 0)) return false;
  // Transform point to square's local coords
  const cos = Math.cos(-S.sqAngle), sin = Math.sin(-S.sqAngle);
  const dx = ix - S.sqCx, dy = iy - S.sqCy;
  const lx = dx*cos - dy*sin;
  const ly = dx*sin + dy*cos;
  const hw = S.sqW / 2, hh = S.sqH / 2;
  return Math.abs(lx) <= hw && Math.abs(ly) <= hh;
}

// 正北箭头命中：只有箭杆（中心→尖端）和箭头本身可以抓取旋转，罗盘其它部分不响应
function hitTestNorthHandle(ix, iy) {
  if (S.step < 3) return false;
  const sz = getRectSize();
  const ringR = sz / 2 + 30;
  const arrowLen = ringR + 20 / S.vScale;   // 与 drawNorthIndicator 中箭杆长度一致
  const sin = Math.sin(S.northAngle), cos = Math.cos(S.northAngle);
  const tipX = S.sqCx + arrowLen * sin;     // 北向角度 a 的方向 = (sin a, −cos a)
  const tipY = S.sqCy - arrowLen * cos;
  // 箭杆（含中心起点）
  if (pointSegDist(ix, iy, S.sqCx, S.sqCy, tipX, tipY) <= 10 / S.vScale) return true;
  // 箭头头部
  if (dist({x:ix, y:iy}, {x:tipX, y:tipY}) <= 14 / S.vScale) return true;
  return false;
}

// 复制图层：当前内容尺寸（裁剪后按裁剪尺寸）
function copyLayerSize() {
  const L = S.copyLayer;
  if (!L) return { w: 0, h: 0 };
  return { w: L.crop ? L.crop.sw : S.imgW, h: L.crop ? L.crop.sh : S.imgH };
}

// 原图坐标 → 图层局部坐标（第三步裁剪框选以图层为基准）
function imgToLayerLocal(ix, iy) {
  const L = S.copyLayer;
  const cos = Math.cos(-L.angle), sin = Math.sin(-L.angle);
  const dx = ix - L.cx, dy = iy - L.cy;
  return { x: (dx * cos - dy * sin) / L.scale, y: (dx * sin + dy * cos) / L.scale };
}

// 裁剪框四角命中：0=右下 1=左下 2=左上 3=右上（cp 与 rect 在同一坐标系）
function cropRectCornerHit(cp, r, hitR) {
  const corners = [
    { x: r.x + r.w, y: r.y + r.h },
    { x: r.x,       y: r.y + r.h },
    { x: r.x,       y: r.y },
    { x: r.x + r.w, y: r.y },
  ];
  for (let i = 0; i < 4; i++) {
    if (dist(cp, corners[i]) < hitR) return i;
  }
  return -1;
}

// 复制图层：点是否在图层矩形内（仅第三步、图层可见时有效）
function copyLayerBodyHit(ix, iy) {
  const L = S.copyLayer;
  if (!L || !L.visible || S.step !== 3 || S.cropMode) return false;
  const { w, h } = copyLayerSize();
  const cos = Math.cos(-L.angle), sin = Math.sin(-L.angle);
  const dx = ix - L.cx, dy = iy - L.cy;
  const lx = (dx * cos - dy * sin) / L.scale;
  const ly = (dx * sin + dy * cos) / L.scale;
  return Math.abs(lx) <= w / 2 && Math.abs(ly) <= h / 2;
}

// 复制图层：旋转手柄（图层顶部中点，画布坐标约13px半径）
function copyLayerRotHandleHit(ix, iy) {
  const L = S.copyLayer;
  if (!L || !L.visible || S.step !== 3 || S.cropMode) return false;
  const { w, h } = copyLayerSize();
  const rh = getRotHandle(L.cx, L.cy, w * L.scale, h * L.scale, L.angle);
  return dist({x:ix, y:iy}, rh) < 13 / S.vScale;
}

function hitTestMountain(ix, iy) {
  if (S.step < 4 || (S.sqW <= 0 && S.sqH <= 0)) return -1;
  const radius = getRectSize() * S.gridScale / 2;
  const dx = ix - S.sqCx;
  const dy = iy - S.sqCy;
  const dist = Math.hypot(dx, dy);
  if (dist < 5 || dist > radius + 10) return -1;
  // Angle from north (0° = up in image coords, CW+)
  let angle = Math.atan2(dx, -dy) * 180 / Math.PI; // 0°=north, CW+
  // Adjust for northAngle: convert to compass-aligned coords
  angle = angle - S.northAngle * 180 / Math.PI;
  // Normalize to [0, 360)
  angle = ((angle % 360) + 360) % 360;
  // Each mountain spans 15°, centered on its angle
  // Mountain 0 (子) is at 0°; Mountain 1 (癸) at 15°, etc.
  let idx = Math.round(angle / 15) % 24;
  return idx;
}

// ═══════════════════════════════════════
//  DRAWING
// ═══════════════════════════════════════
function draw() {
  const c = els.canvas;
  ctx.clearRect(0, 0, c.width, c.height);

  // Background
  ctx.fillStyle = '#faf7f0';
  ctx.fillRect(0, 0, c.width, c.height);

  if (!S.img) return;

  // ── Image ──
  ctx.save();
  applyImgSpace();
  if (S.imgTrans.crop) {
    const c = S.imgTrans.crop;
    ctx.drawImage(S.img, c.sx, c.sy, c.sw, c.sh, 0, 0, c.sw, c.sh);
  } else {
    ctx.drawImage(S.img, 0, 0, S.imgW, S.imgH);
  }
  ctx.restore();

  // ── Overlays (square / compass / grid) ──
  ctx.save();
  if (S.step >= 4) ctx.globalAlpha = 1 - S.overlayTransparency;

  if (S.step >= 2 && (S.sqW > 0 || S.sqH > 0)) {
    drawSquare1();
  }

  if (S.step >= 3) {
    drawNorthIndicator();
  }
  ctx.restore(); // end overlay alpha

  // ── 24 Mountains compass (independent transparency) ──
  if (S.step >= 4) {
    ctx.save();
    ctx.globalAlpha = 1 - S.compassTransparency;
    draw24Mountains();
    ctx.restore();
  }

  // ── 原图复制图层（只在第三步显示；默认置顶，画在红框/罗盘等辅助线之上；
  //     裁剪模式下暂时完全不透明，方便看清要裁的内容） ──
  if (S.step === 3 && S.copyLayer && S.copyLayer.visible) {
    drawCopyLayer(S.cropMode);
  }

  // ── 裁剪模式框选（画在最上层，第二/三步） ──
  if (S.cropMode && (S.step === 2 || S.step === 3)) drawCropRect();

  // Debounced autosave — state changes all funnel through draw()
  scheduleAutosave();
}

function drawSquare1() {
  const {sqCx:cx, sqCy:cy, sqW:w, sqH:h, sqAngle:angle} = S;
  const corners = getCorners(cx, cy, w, h, angle);
  const rh = getRotHandle(cx, cy, w, h, angle);

  // ── Square fill ──
  ctx.save();
  applyImgSpace();

  // Fill (85% transparent scarlet = 15% opacity)
  ctx.fillStyle = 'rgba(220, 30, 50, 0.15)';
  ctx.strokeStyle = 'rgba(220, 30, 50, 0.85)';
  ctx.lineWidth = 2.5 / S.vScale;
  ctx.setLineDash([]);

  ctx.beginPath();
  ctx.moveTo(corners[0].x, corners[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // ── Diagonal guide lines ──
  ctx.strokeStyle = 'rgba(220, 30, 50, 0.3)';
  ctx.lineWidth = 1 / S.vScale;
  ctx.setLineDash([6/S.vScale, 6/S.vScale]);
  ctx.beginPath();
  ctx.moveTo(corners[0].x, corners[0].y);
  ctx.lineTo(corners[2].x, corners[2].y);
  ctx.moveTo(corners[1].x, corners[1].y);
  ctx.lineTo(corners[3].x, corners[3].y);
  ctx.stroke();
  ctx.setLineDash([]);

  // ── Center crosshair ──
  const chSize = 12 / S.vScale;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1.8 / S.vScale;
  ctx.beginPath();
  ctx.moveTo(cx - chSize, cy); ctx.lineTo(cx + chSize, cy);
  ctx.moveTo(cx, cy - chSize); ctx.lineTo(cx, cy + chSize);
  ctx.stroke();
  // Center dot
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(cx, cy, 3.5/S.vScale, 0, Math.PI*2);
  ctx.fill();

  // ── Corner handles (only in step 2 — square adjustment mode) ──
  if (S.step === 2) {
    const hSize = 8 / S.vScale;
    for (let i = 0; i < 4; i++) {
      const isHover = S.hoverCorner === i || (S.dragMode === 'scale' && S.dragCorner === i);
      ctx.fillStyle = isHover ? '#ff5566' : 'rgba(60,30,20,0.85)';
      ctx.strokeStyle = isHover ? '#ff3048' : 'rgba(80,60,40,0.6)';
      ctx.lineWidth = 2 / S.vScale;
      ctx.beginPath();
      ctx.rect(corners[i].x - hSize, corners[i].y - hSize, hSize*2, hSize*2);
      ctx.fill();
      ctx.stroke();
    }

    // ── Rotation handle (only in step 2) ──
    const isHover = S.hoverMode === 'rotate' || S.dragMode === 'rotate';
    const rHr = HANDLE_R / S.vScale;

    // Connecting line
    ctx.strokeStyle = 'rgba(60,30,20,0.4)';
    ctx.lineWidth = 1.5 / S.vScale;
    ctx.setLineDash([4/S.vScale, 4/S.vScale]);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(rh.x, rh.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Handle circle
    ctx.fillStyle = isHover ? '#ff5566' : 'rgba(255,220,220,0.9)';
    ctx.strokeStyle = isHover ? '#ff3048' : 'rgba(200,150,150,0.8)';
    ctx.lineWidth = 2 / S.vScale;
    ctx.beginPath();
    ctx.arc(rh.x, rh.y, rHr, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();

    // Rotation icon (small arrow arc)
    ctx.strokeStyle = '#6b5040';
    ctx.lineWidth = 1.5 / S.vScale;
    ctx.beginPath();
    ctx.arc(rh.x, rh.y, rHr*0.45, -Math.PI*0.7, Math.PI*0.7);
    ctx.stroke();
    // Arrowhead
    const ax = rh.x + rHr*0.45 * Math.cos(Math.PI*0.7);
    const ay = rh.y + rHr*0.45 * Math.sin(Math.PI*0.7);
    ctx.fillStyle = '#6b5040';
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.lineTo(ax - 3/S.vScale, ay - 3/S.vScale);
    ctx.lineTo(ax + 3/S.vScale, ay - 3/S.vScale);
    ctx.closePath();
    ctx.fill();
  }

  // ── Size label ──
  ctx.fillStyle = 'rgba(60,30,20,0.7)';
  ctx.font = `${12/S.vScale}px -apple-system,"PingFang SC",sans-serif`;
  ctx.textAlign = 'center';
  const labelY = cy - h/2 - 18/S.vScale;
  ctx.fillText(`${Math.round(w)}×${Math.round(h)} px`, cx, labelY);

  ctx.restore();
}

// ═══════════════════════════════════════
//  原图复制图层（v2.4）
// ═══════════════════════════════════════
function drawCopyLayer(forceOpaque) {
  const L = S.copyLayer;
  if (!L || !S.img) return;

  const sw = L.crop ? L.crop.sw : S.imgW;
  const sh = L.crop ? L.crop.sh : S.imgH;

  ctx.save();
  applyImgSpace();
  ctx.globalAlpha = forceOpaque ? 1 : (1 - L.transparency);   // 裁剪模式下暂时完全不透明
  ctx.translate(L.cx, L.cy);
  ctx.rotate(L.angle);
  ctx.scale(L.scale, L.scale);
  if (L.crop) {
    ctx.drawImage(S.img, L.crop.sx, L.crop.sy, L.crop.sw, L.crop.sh, -sw / 2, -sh / 2, sw, sh);
  } else {
    ctx.drawImage(S.img, -S.imgW / 2, -S.imgH / 2, S.imgW, S.imgH);
  }
  ctx.restore();

  // 操作手柄 / 虚线边框 —— 仅第三步（调整模式；裁剪模式下隐藏）
  if (S.step === 3 && !S.cropMode) {
    drawCopyLayerHandles();
  }
}

function drawCopyLayerHandles() {
  const L = S.copyLayer;
  const sw = L.crop ? L.crop.sw : S.imgW;
  const sh = L.crop ? L.crop.sh : S.imgH;
  const w = sw * L.scale, h = sh * L.scale;

  ctx.save();
  applyImgSpace();

  // 虚线边框（旋转后的图层范围）
  const corners = getCorners(L.cx, L.cy, w, h, L.angle);
  ctx.strokeStyle = 'rgba(53,115,176,0.55)';
  ctx.lineWidth = 1.6 / S.vScale;
  ctx.setLineDash([8/S.vScale, 6/S.vScale]);
  ctx.beginPath();
  ctx.moveTo(corners[0].x, corners[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(corners[i].x, corners[i].y);
  ctx.closePath();
  ctx.stroke();
  ctx.setLineDash([]);

  // 旋转手柄（图层顶部中点）
  const rh = getRotHandle(L.cx, L.cy, w, h, L.angle);
  const isHover = S.hoverMode === 'layer-rotate' || S.dragMode === 'layer-rotate';
  const rHr = 11 / S.vScale;

  ctx.strokeStyle = 'rgba(53,115,176,0.45)';
  ctx.lineWidth = 1.4 / S.vScale;
  ctx.setLineDash([4/S.vScale, 4/S.vScale]);
  ctx.beginPath();
  ctx.moveTo(L.cx, L.cy);
  ctx.lineTo(rh.x, rh.y);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = isHover ? '#4a90d9' : 'rgba(220,235,250,0.95)';
  ctx.strokeStyle = isHover ? '#3573b0' : 'rgba(120,150,180,0.85)';
  ctx.lineWidth = 2 / S.vScale;
  ctx.beginPath();
  ctx.arc(rh.x, rh.y, rHr, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 旋转图标（小圆弧+箭头）
  ctx.strokeStyle = '#3573b0';
  ctx.lineWidth = 1.5 / S.vScale;
  ctx.beginPath();
  ctx.arc(rh.x, rh.y, rHr * 0.45, -Math.PI * 0.7, Math.PI * 0.7);
  ctx.stroke();
  const ax = rh.x + rHr * 0.45 * Math.cos(Math.PI * 0.7);
  const ay = rh.y + rHr * 0.45 * Math.sin(Math.PI * 0.7);
  ctx.fillStyle = '#3573b0';
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(ax - 3/S.vScale, ay - 3/S.vScale);
  ctx.lineTo(ax + 3/S.vScale, ay - 3/S.vScale);
  ctx.closePath();
  ctx.fill();

  // 手柄旁文字标注
  ctx.fillStyle = '#3573b0';
  ctx.font = `${11/S.vScale}px -apple-system,"PingFang SC",sans-serif`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('图层', rh.x + 15/S.vScale, rh.y);

  ctx.restore();
}

// 第三步裁剪框选：在图层局部坐标里压暗/画框（整组跟随图层的移动旋转缩放显示）
function drawCropRectLayerLocal(r) {
  const L = S.copyLayer;
  const { w: cw, h: ch } = copyLayerSize();
  const u = S.vScale * L.scale;   // 局部坐标 → 画布的缩放
  ctx.save();
  applyImgSpace();
  ctx.translate(L.cx, L.cy);
  ctx.rotate(L.angle);
  ctx.scale(L.scale, L.scale);
  if (r && r.w > 0 && r.h > 0) {
    const x0 = Math.max(-cw / 2, r.x), y0 = Math.max(-ch / 2, r.y);
    const x1 = Math.min(cw / 2, r.x + r.w), y1 = Math.min(ch / 2, r.y + r.h);
    // 框外压暗，框内保持原样
    ctx.fillStyle = 'rgba(30,25,15,0.35)';
    ctx.fillRect(-cw / 2, -ch / 2, cw, Math.max(0, y0 + ch / 2));
    ctx.fillRect(-cw / 2, y1, cw, Math.max(0, ch / 2 - y1));
    ctx.fillRect(-cw / 2, y0, Math.max(0, x0 + cw / 2), y1 - y0);
    ctx.fillRect(x1, y0, Math.max(0, cw / 2 - x1), y1 - y0);
    // 绿色虚线框
    ctx.strokeStyle = '#2e9e4f';
    ctx.lineWidth = 2 / u;
    ctx.setLineDash([7/u, 5/u]);
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.setLineDash([]);
    // 尺寸标注（框上方）
    ctx.fillStyle = '#1d6b35';
    ctx.font = `bold ${13/u}px -apple-system,"PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`${Math.round(r.w)}×${Math.round(r.h)} px`, r.x + r.w / 2, Math.max(14/u, r.y - 6/u));
    // 四角手柄（拖拽继续调整）
    const hSize = 5 / u;
    const crn = [
      { x: r.x + r.w, y: r.y + r.h },
      { x: r.x,       y: r.y + r.h },
      { x: r.x,       y: r.y },
      { x: r.x + r.w, y: r.y },
    ];
    for (let i = 0; i < 4; i++) {
      const isHover = (S.dragMode === 'crop-corner' && S.dragCorner === i) || (S.hoverMode === 'crop-corner' && S.hoverCorner === i);
      ctx.fillStyle = isHover ? '#3cb964' : '#2e9e4f';
      ctx.strokeStyle = '#1d6b35';
      ctx.lineWidth = 1.2 / u;
      ctx.beginPath();
      ctx.rect(crn[i].x - hSize, crn[i].y - hSize, hSize * 2, hSize * 2);
      ctx.fill();
      ctx.stroke();
    }
  } else {
    // 尚未框选：整体压暗 + 提示文字
    ctx.fillStyle = 'rgba(30,25,15,0.20)';
    ctx.fillRect(-cw / 2, -ch / 2, cw, ch);
    ctx.fillStyle = '#1d6b35';
    ctx.font = `bold ${15/u}px -apple-system,"PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✂️ 按住拖动，框选要保留的区域', 0, 0);
  }
  ctx.restore();
}

// 裁剪模式：框外压暗 + 绿色虚线框 + 尺寸标注（第二/三步共用）
function drawCropRect() {
  const r = S.cropRect;
  // 第三步：框选贴在图层上（图层局部坐标，跟着图层的旋转缩放显示）
  if (S.step === 3 && S.copyLayer) {
    drawCropRectLayerLocal(r);
    return;
  }
  ctx.save();
  applyImgSpace();
  if (r && r.w > 0 && r.h > 0) {
    // 可见区域（已裁剪的图片则按裁剪区域算）
    const T = S.imgTrans;
    const vx0 = T.crop ? T.crop.sx : 0;
    const vy0 = T.crop ? T.crop.sy : 0;
    const vw = T.crop ? T.crop.sw : S.imgW;
    const vh = T.crop ? T.crop.sh : S.imgH;
    const x0 = Math.max(vx0, r.x), y0 = Math.max(vy0, r.y);
    const x1 = Math.min(vx0 + vw, r.x + r.w), y1 = Math.min(vy0 + vh, r.y + r.h);
    // 框外压暗，框内保持原样
    ctx.fillStyle = 'rgba(30,25,15,0.35)';
    ctx.fillRect(vx0, vy0, vw, Math.max(0, y0 - vy0));
    ctx.fillRect(vx0, y1, vw, Math.max(0, vy0 + vh - y1));
    ctx.fillRect(vx0, y0, Math.max(0, x0 - vx0), y1 - y0);
    ctx.fillRect(x1, y0, Math.max(0, vx0 + vw - x1), y1 - y0);
    // 绿色虚线框
    ctx.strokeStyle = '#2e9e4f';
    ctx.lineWidth = 2 / S.vScale;
    ctx.setLineDash([7/S.vScale, 5/S.vScale]);
    ctx.strokeRect(r.x, r.y, r.w, r.h);
    ctx.setLineDash([]);
    // 尺寸标注（框上方）
    ctx.fillStyle = '#1d6b35';
    ctx.font = `bold ${13/S.vScale}px -apple-system,"PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.fillText(`${Math.round(r.w)}×${Math.round(r.h)} px`, r.x + r.w / 2, Math.max(14/S.vScale, r.y - 6/S.vScale));
    // 四角手柄（拖拽继续调整）
    const hSize = 5 / S.vScale;
    const crn = [
      { x: r.x + r.w, y: r.y + r.h },
      { x: r.x,       y: r.y + r.h },
      { x: r.x,       y: r.y },
      { x: r.x + r.w, y: r.y },
    ];
    for (let i = 0; i < 4; i++) {
      const isHover = (S.dragMode === 'crop-corner' && S.dragCorner === i) || (S.hoverMode === 'crop-corner' && S.hoverCorner === i);
      ctx.fillStyle = isHover ? '#3cb964' : '#2e9e4f';
      ctx.strokeStyle = '#1d6b35';
      ctx.lineWidth = 1.2 / S.vScale;
      ctx.beginPath();
      ctx.rect(crn[i].x - hSize, crn[i].y - hSize, hSize * 2, hSize * 2);
      ctx.fill();
      ctx.stroke();
    }
  } else {
    // 尚未框选：整体压暗 + 提示文字
    const T = S.imgTrans;
    const vw = T.crop ? T.crop.sw : S.imgW;
    const vh = T.crop ? T.crop.sh : S.imgH;
    const vx0 = T.crop ? T.crop.sx : 0;
    const vy0 = T.crop ? T.crop.sy : 0;
    ctx.fillStyle = 'rgba(30,25,15,0.20)';
    ctx.fillRect(vx0, vy0, vw, vh);
    ctx.fillStyle = '#1d6b35';
    ctx.font = `bold ${15/S.vScale}px -apple-system,"PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✂️ 按住拖动，框选要保留的区域', vx0 + vw / 2, vy0 + vh / 2);
  }
  ctx.restore();
}

function drawNorthIndicator() {
  const {sqCx:cx, sqCy:cy, northAngle:a} = S;
  const sz = getRectSize();

  ctx.save();
  applyImgSpace();

  const ringR = sz/2 + 30;       // inner rotating compass radius
  const outerR = ringR + 16;       // fixed outer ring

  // ── Fixed outer ring (reference) ──
  ctx.strokeStyle = 'rgba(160,140,110,0.5)';
  ctx.lineWidth = 2 / S.vScale;
  ctx.beginPath();
  ctx.arc(cx, cy, outerR, 0, Math.PI*2);
  ctx.stroke();

  // Fixed-top marker (image "up" indicator)
  const topY = cy - outerR;
  ctx.fillStyle = 'rgba(160,140,110,0.7)';
  ctx.beginPath();
  ctx.moveTo(cx, topY - 10/S.vScale);
  ctx.lineTo(cx - 7/S.vScale, topY + 2/S.vScale);
  ctx.lineTo(cx + 7/S.vScale, topY + 2/S.vScale);
  ctx.closePath();
  ctx.fill();

  // ── Rotating compass disc ──
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(a);   // compass rotates with north angle

  // 圆盘内部透明（不遮底图），只保留外圈框线
  ctx.strokeStyle = 'rgba(180,150,110,0.7)';
  ctx.lineWidth = 2 / S.vScale;
  ctx.beginPath();
  ctx.arc(0, 0, ringR, 0, Math.PI*2);
  ctx.stroke();

  // Inner ring
  ctx.strokeStyle = 'rgba(180,150,110,0.35)';
  ctx.lineWidth = 1 / S.vScale;
  ctx.beginPath();
  ctx.arc(0, 0, ringR - 8/S.vScale, 0, Math.PI*2);
  ctx.stroke();

  // Tick marks every 5° (rotating with compass)
  for (let d = 0; d < 360; d += 5) {
    const rad = d * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);
    const isCardinal = d % 90 === 0;
    const isIntercardinal = d % 45 === 0 && !isCardinal;
    const isMajor = d % 15 === 0;
    const inner = ringR - (isCardinal ? 16 : isIntercardinal ? 12 : isMajor ? 9 : 5);
    const outer = ringR;
    ctx.strokeStyle = isCardinal ? 'rgba(180,30,30,0.8)' :
                      isIntercardinal ? 'rgba(140,100,60,0.65)' :
                      'rgba(160,130,90,0.4)';
    ctx.lineWidth = (isCardinal ? 2.2 : isIntercardinal ? 1.5 : 0.8) / S.vScale;
    ctx.beginPath();
    ctx.moveTo(inner * sin, -inner * cos);
    ctx.lineTo(outer * sin, -outer * cos);
    ctx.stroke();
  }

  // Cardinal labels (rotating with compass)
  const labels = [
    {d:0,   t:'北', c:'#b52330'},
    {d:45,  t:'东北',c:'#8c6b4a'},
    {d:90,  t:'东', c:'#6b5040'},
    {d:135, t:'东南',c:'#8c6b4a'},
    {d:180, t:'南', c:'#6b5040'},
    {d:225, t:'西南',c:'#8c6b4a'},
    {d:270, t:'西', c:'#6b5040'},
    {d:315, t:'西北',c:'#8c6b4a'},
  ];
  const labelR = ringR - 24/S.vScale;
  const labelSize = 10.5 / S.vScale;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const l of labels) {
    const rad = l.d * Math.PI / 180;
    const lx = labelR * Math.sin(rad);
    const ly = -labelR * Math.cos(rad);
    ctx.fillStyle = l.c;
    ctx.font = `bold ${l.d%90===0 ? labelSize*1.25 : labelSize}px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillText(l.t, lx, ly);
  }

  // North pointer arrow (fixed on compass, points to "北" at 0°)
  const arrowLen = ringR + 20/S.vScale;
  // Shaft — from center outward
  ctx.strokeStyle = '#b52330';
  ctx.lineWidth = 2.5 / S.vScale;
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -arrowLen);
  ctx.stroke();

  // Arrowhead
  const ahSize = 10 / S.vScale;
  ctx.fillStyle = '#b52330';
  ctx.beginPath();
  ctx.moveTo(0, -arrowLen);
  ctx.lineTo(-ahSize*0.55, -arrowLen + ahSize);
  ctx.lineTo(ahSize*0.55, -arrowLen + ahSize);
  ctx.closePath();
  ctx.fill();

  // Center dot
  ctx.fillStyle = '#b52330';
  ctx.beginPath();
  ctx.arc(0, 0, 4/S.vScale, 0, Math.PI*2);
  ctx.fill();

  ctx.restore(); // end rotating group

  // ── Fixed south marker on outer ring ──
  {
    const sy = cy + outerR + 14/S.vScale;
    ctx.fillStyle = 'rgba(100,80,60,0.5)';
    ctx.font = `${10/S.vScale}px -apple-system,"PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('南', cx, sy);
  }

  ctx.restore();
}

function draw24Mountains() {
  const {sqCx:cx, sqCy:cy, northAngle:a, gridScale} = S;
  const R = getRectSize() * gridScale / 2; // main compass radius

  ctx.save();
  applyImgSpace();

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(a);

  // ── Two-layer ring radii ──
  //   ringMain  ←→ ringMid  : outer layer = 24 mountains
  //   ringMid   ←→ ringInner: inner layer = 8 trigrams
  //   ringInner ←→ 0        : center
  const ringMain   = R;
  const ringMid    = R * 0.52; // divider between 24-mountain & 8-trigram layers
  const ringInner  = R * 0.10; // tiny center hub

  // ═══════════════════════════════════════
  // 1. Solid background disc
  // ═══════════════════════════════════════
  ctx.fillStyle = '#fcf9f2';
  ctx.beginPath();
  ctx.arc(0, 0, ringMain + 4, 0, Math.PI*2);
  ctx.fill();

  // ═══════════════════════════════════════
  // 2. Two ring circles
  // ═══════════════════════════════════════
  ctx.strokeStyle = '#3d2e1f';
  ctx.lineWidth = 2.0 / S.vScale;
  ctx.beginPath(); ctx.arc(0, 0, ringMain, 0, Math.PI*2); ctx.stroke();

  ctx.lineWidth = 1.5 / S.vScale;
  ctx.beginPath(); ctx.arc(0, 0, ringMid, 0, Math.PI*2); ctx.stroke();

  ctx.lineWidth = 1.0 / S.vScale;
  ctx.strokeStyle = '#8c7b6b';
  ctx.beginPath(); ctx.arc(0, 0, ringInner, 0, Math.PI*2); ctx.stroke();

  // ═══════════════════════════════════════
  // 3. Inner ring: 8 trigram sector fills (五行配色)
  // ═══════════════════════════════════════
  const trigramSectors = [
    {t:'坎', deg:0,   elem:'水'},  // 水 → 蓝
    {t:'艮', deg:45,  elem:'土'},  // 土 → 棕
    {t:'震', deg:90,  elem:'木'},  // 木 → 绿
    {t:'巽', deg:135, elem:'木'},  // 木 → 绿
    {t:'离', deg:180, elem:'火'},  // 火 → 红
    {t:'坤', deg:225, elem:'土'},  // 土 → 棕
    {t:'兑', deg:270, elem:'金'},  // 金 → 白
    {t:'乾', deg:315, elem:'金'},  // 金 → 白
  ];
  for (const s of trigramSectors) {
    const startAngle = ((s.deg - 22.5 - 90) * Math.PI / 180);
    const endAngle   = ((s.deg + 22.5 - 90) * Math.PI / 180);
    ctx.fillStyle = hexToRgba(ELEMENT_BG[s.elem], 0.65);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, ringMid, startAngle, endAngle);
    ctx.closePath();
    ctx.fill();
  }

  // ═══════════════════════════════════════
  // 4. Sector boundary lines
  //    Trigram boundaries (8 lines, every 45°, at 22.5°+k*45°):
  //      full span: ringInner → ringMain → outer ring edge
  //    24-mountain dividers (16 lines):
  //      outer ring only: ringMid → ringMain
  // ═══════════════════════════════════════
  for (let i = 0; i < 24; i++) {
    // Each line sits at the LEFT boundary of mountain[i]:
    //   boundary angle = mountain[i].angle - 7.5°
    const boundaryDeg = MOUNTAINS_24[i][5] - 7.5;
    const rad = (boundaryDeg - 90) * Math.PI / 180;
    const cos = Math.cos(rad), sin = Math.sin(rad);

    // Trigram boundaries at 22.5°+k*45° → i ∈ {2,5,8,11,14,17,20,23}
    const isTrigram = (i % 3 === 2);

    // Same dark color & weight for all divider lines
    ctx.strokeStyle = '#3d2e1f';
    ctx.lineWidth = 1.6 / S.vScale;
    ctx.beginPath();
    const lineStart = isTrigram ? ringInner : ringMid;
    ctx.moveTo(lineStart * cos, lineStart * sin);
    ctx.lineTo(ringMain * cos, ringMain * sin);
    ctx.stroke();
  }

  // ═══════════════════════════════════════
  // 4. 24 mountain names — outer ring
  // ═══════════════════════════════════════
  const mountainLabelR = (ringMain + ringMid) / 2;
  const fontSize = 16 / S.vScale;
  ctx.fillStyle = '#3d2e1f';
  ctx.font = `600 ${fontSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (let i = 0; i < 24; i++) {
    const m = MOUNTAINS_24[i];
    const midAngle = (m[5] - 90) * Math.PI / 180;
    const lx = mountainLabelR * Math.cos(midAngle);
    const ly = mountainLabelR * Math.sin(midAngle);
    ctx.save();
    ctx.translate(lx, ly);
    ctx.rotate(midAngle + Math.PI/2);
    ctx.fillText(m[0], 0, 0);
    ctx.restore();
  }

  // ═══════════════════════════════════════
  // 5. Eight trigram names — inner ring
  // ═══════════════════════════════════════
  const trigramR = (ringMid + ringInner) / 2;
  const trigramSize = 16 / S.vScale;
  const trigramLabels = [
    {t:'坎', deg:0},
    {t:'艮', deg:45},
    {t:'震', deg:90},
    {t:'巽', deg:135},
    {t:'离', deg:180},
    {t:'坤', deg:225},
    {t:'兑', deg:270},
    {t:'乾', deg:315},
  ];
  ctx.fillStyle = '#3d2e1f';
  ctx.font = `bold ${trigramSize}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of trigramLabels) {
    const rad = (t.deg - 90) * Math.PI / 180;
    const tx = trigramR * Math.cos(rad);
    const ty = trigramR * Math.sin(rad);
    ctx.fillText(t.t, tx, ty);
  }

  // ═══════════════════════════════════════
  // 6. Center — simple cross + north arrow
  // ═══════════════════════════════════════
  const crossLen = ringInner * 0.85;
  ctx.strokeStyle = '#3d2e1f';
  ctx.lineWidth = 1.2 / S.vScale;
  ctx.beginPath();
  ctx.moveTo(0, -crossLen); ctx.lineTo(0, crossLen);
  ctx.moveTo(-crossLen, 0); ctx.lineTo(crossLen, 0);
  ctx.stroke();

  // Red north pointer
  ctx.fillStyle = '#b52330';
  ctx.beginPath();
  ctx.moveTo(0, -crossLen - 4/S.vScale);
  ctx.lineTo(-4/S.vScale, -crossLen + 6/S.vScale);
  ctx.lineTo(4/S.vScale, -crossLen + 6/S.vScale);
  ctx.closePath();
  ctx.fill();

  // Center dot
  ctx.fillStyle = '#3d2e1f';
  ctx.beginPath();
  ctx.arc(0, 0, 2.5/S.vScale, 0, Math.PI*2);
  ctx.fill();

  // ═══════════════════════════════════════
  // 7. ⚠️ markers on marked mountains
  // ═══════════════════════════════════════
  for (const mi of S.markedMountains) {
    if (mi < 0 || mi >= 24) continue;
    const m = MOUNTAINS_24[mi];
    const mRad = (m[5] - 90) * Math.PI / 180;
    const warnR = (ringMain + ringMid) / 2; // center of outer ring
    const wx = warnR * Math.cos(mRad);
    const wy = warnR * Math.sin(mRad);

    const glowR = ringMid * 0.12;
    const grad = ctx.createRadialGradient(wx, wy, glowR*0.3, wx, wy, glowR);
    grad.addColorStop(0, 'rgba(255, 200, 0, 0.5)');
    grad.addColorStop(0.5, 'rgba(255, 140, 0, 0.25)');
    grad.addColorStop(1, 'rgba(255, 80, 0, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(wx, wy, glowR, 0, Math.PI*2);
    ctx.fill();

    const warnSize = Math.max(14, ringMid * 0.12) / S.vScale;
    ctx.fillStyle = '#ff9500';
    ctx.font = `bold ${warnSize}px "PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('⚠️', wx, wy);
  }

  ctx.restore(); // end rotation
  ctx.restore(); // end image transform
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ═══════════════════════════════════════
//  RESIZE
// ═══════════════════════════════════════
function resize() {
  const rect = els.wrap.getBoundingClientRect();
  els.canvas.width = rect.width * window.devicePixelRatio;
  els.canvas.height = rect.height * window.devicePixelRatio;
  els.canvas.style.width = rect.width + 'px';
  els.canvas.style.height = rect.height + 'px';
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  fitImage();
}

// 适应窗口时的视图倍率（按旋转后的外接框计算，避免边角被裁掉）
function fitScale() {
  if (!S.img) return 1;
  const T = S.imgTrans;
  const cw = T.crop ? T.crop.sw : S.imgW;
  const ch = T.crop ? T.crop.sh : S.imgH;
  const cos = Math.abs(Math.cos(T.angle)), sin = Math.abs(Math.sin(T.angle));
  const dispW = cw * cos + ch * sin;
  const dispH = cw * sin + ch * cos;
  const canvasW = els.canvas.width / window.devicePixelRatio;
  const canvasH = els.canvas.height / window.devicePixelRatio;
  return Math.min(canvasW / dispW, canvasH / dispH) * 0.88;
}

function fitImage() {
  if (!S.img) return;
  const T = S.imgTrans;
  const cw = T.crop ? T.crop.sw : S.imgW;
  const ch = T.crop ? T.crop.sh : S.imgH;
  const s = fitScale();
  S.vScale = s;
  // 旋转绕可见区域中心，居中计算与角度无关
  S.vx = (els.canvas.width / window.devicePixelRatio - cw * s) / 2;
  S.vy = (els.canvas.height / window.devicePixelRatio - ch * s) / 2;
}

// ═══════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════
function getPos(e) {
  const rect = els.canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

els.canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) { // right/middle → pan
    if (e.button === 1 || e.button === 2) {
      S.dragMode = 'pan';
      S.dragStart = getPos(e);
      S.dragState = {vx: S.vx, vy: S.vy};
    }
    return;
  }
  if (!S.img) return;
  const pos = getPos(e);
  const ip = canvas2img(pos.x, pos.y);

  if (S.step === 2) {
    // 裁剪模式：已有框时先查四角（拖角调整），否则按住拖动新建框
    if (S.cropMode) {
      if (S.cropRect && S.cropRect.w > 0 && S.cropRect.h > 0) {
        const ci = cropRectCornerHit(ip, S.cropRect, 9 / S.vScale);
        if (ci >= 0) {
          S.dragMode = 'crop-corner';
          S.dragCorner = ci;
          S.dragStart = ip;
          const r = S.cropRect;
          S.dragState = { x0: r.x, y0: r.y, x1: r.x + r.w, y1: r.y + r.h };
          return;
        }
      }
      S.dragMode = 'crop';
      S.dragStart = ip;
      S.cropRect = { x: ip.x, y: ip.y, w: 0, h: 0 };
      return;
    }
    // Check rotation handle first
    if (hitTestRotHandle(ip.x, ip.y)) {
      S.dragMode = 'rotate';
      S.dragStart = ip;
      S.dragState = {angle: S.sqAngle};
      return;
    }
    // Check corner handles
    const ci = hitTestCorner(ip.x, ip.y);
    if (ci >= 0) {
      S.dragMode = 'scale';
      S.dragCorner = ci;
      S.dragStart = ip;
      // Anchor the opposite corner (fixed during scale)
      const corners = getCorners(S.sqCx, S.sqCy, S.sqW, S.sqH, S.sqAngle);
      const opp = corners[(ci + 2) % 4];
      S.dragState = { oppCorner: {x: opp.x, y: opp.y}, angle: S.sqAngle };
      return;
    }
    // Check square body
    if (hitTestSquareBody(ip.x, ip.y)) {
      S.dragMode = 'move';
      S.dragStart = ip;
      S.dragState = {cx: S.sqCx, cy: S.sqCy};
      return;
    }
    // If no square exists, create one by drag
    if (S.sqW <= 0 && S.sqH <= 0) {
      S.dragMode = 'create';
      S.dragStart = ip;
      return;
    }
    // Else pan
    S.dragMode = 'pan';
    S.dragStart = pos;
    S.dragState = {vx: S.vx, vy: S.vy};
    return;
  }

  if (S.step === 3) {
    // 裁剪模式：已有框时先查四角（拖角调整），否则按住拖动新建框（以图层为基准）
    if (S.cropMode) {
      const p = imgToLayerLocal(ip.x, ip.y);
      if (S.cropRect && S.cropRect.w > 0 && S.cropRect.h > 0) {
        const ci = cropRectCornerHit(p, S.cropRect, 9 / (S.vScale * S.copyLayer.scale));
        if (ci >= 0) {
          S.dragMode = 'crop-corner';
          S.dragCorner = ci;
          S.dragStart = p;
          const r = S.cropRect;
          S.dragState = { x0: r.x, y0: r.y, x1: r.x + r.w, y1: r.y + r.h };
          return;
        }
      }
      S.dragMode = 'crop';
      S.dragStart = p;
      S.cropRect = { x: p.x, y: p.y, w: 0, h: 0 };
      return;
    }
    const layerOn = S.copyLayer && S.copyLayer.visible;
    // 复制图层的旋转手柄优先
    if (layerOn && copyLayerRotHandleHit(ip.x, ip.y)) {
      S.dragMode = 'layer-rotate';
      S.dragStart = ip;
      S.dragState = { angle: S.copyLayer.angle };
      return;
    }
    // Click on compass area → start rotating
    if (hitTestNorthHandle(ip.x, ip.y)) {
      S.northAngle = Math.atan2(ip.x - S.sqCx, -(ip.y - S.sqCy));
      S.dragMode = 'north';
      S.dragStart = ip;
      S.dragState = {angle: S.northAngle};
      draw();
      updateNorthDisplay();
      return;
    }
    // 图层内部拖动 → 移动图层
    if (layerOn && copyLayerBodyHit(ip.x, ip.y)) {
      S.dragMode = 'layer-move';
      S.dragStart = ip;
      S.dragState = { cx: S.copyLayer.cx, cy: S.copyLayer.cy };
      return;
    }
    // Click outside compass → pan
    S.dragMode = 'pan';
    S.dragStart = pos;
    S.dragState = {vx: S.vx, vy: S.vy};
    return;
  }

  if (S.step === 5) {
    const cellIdx = hitTestMountain(ip.x, ip.y);
    if (cellIdx >= 0) {
      if (S.markedMountains.has(cellIdx)) {
        S.markedMountains.delete(cellIdx);
        toast(`已取消 ${MOUNTAINS_24[cellIdx][0]}(${MOUNTAINS_24[cellIdx][2]}) 的⚠️标记`);
      } else {
        S.markedMountains.add(cellIdx);
        toast(`⚠️ 已标记 ${MOUNTAINS_24[cellIdx][0]}(${MOUNTAINS_24[cellIdx][2]})`);
      }
      draw();
      updateSidebar();
      return;
    }
    // Click outside grid → pan
    S.dragMode = 'pan';
    S.dragStart = pos;
    S.dragState = {vx: S.vx, vy: S.vy};
    return;
  }

  // Default: pan
  S.dragMode = 'pan';
  S.dragStart = pos;
  S.dragState = {vx: S.vx, vy: S.vy};
});

els.canvas.addEventListener('mousemove', e => {
  const pos = getPos(e);
  const ip = canvas2img(pos.x, pos.y);

  // Update hover state
  S.hoverMode = null;
  S.hoverCorner = -1;
  if (S.step === 2 && (S.sqW > 0 || S.sqH > 0) && !S.dragMode && !S.cropMode) {
    if (hitTestRotHandle(ip.x, ip.y)) S.hoverMode = 'rotate';
    else {
      const ci = hitTestCorner(ip.x, ip.y);
      if (ci >= 0) { S.hoverMode = 'scale'; S.hoverCorner = ci; }
      else if (hitTestSquareBody(ip.x, ip.y)) S.hoverMode = 'move';
    }
  }
  if (S.step === 3 && !S.dragMode && !S.cropMode) {
    if (S.copyLayer && S.copyLayer.visible) {
      if (copyLayerRotHandleHit(ip.x, ip.y)) S.hoverMode = 'layer-rotate';
      else if (hitTestNorthHandle(ip.x, ip.y)) S.hoverMode = 'north';
      else if (copyLayerBodyHit(ip.x, ip.y)) S.hoverMode = 'layer-move';
    } else if (hitTestNorthHandle(ip.x, ip.y)) {
      S.hoverMode = 'north';
    }
  }
  if (S.step === 5 && !S.dragMode && hitTestMountain(ip.x, ip.y) >= 0) {
    S.hoverMode = 'mark';
  }
  // 裁剪框四角悬停（第二/三步，框已画好时）
  if (S.cropMode && !S.dragMode && S.cropRect && S.cropRect.w > 0 && S.cropRect.h > 0) {
    let p = ip, hitR = 9 / S.vScale;
    if (S.step === 3 && S.copyLayer) { p = imgToLayerLocal(ip.x, ip.y); hitR = 9 / (S.vScale * S.copyLayer.scale); }
    const ci = cropRectCornerHit(p, S.cropRect, hitR);
    if (ci >= 0) { S.hoverMode = 'crop-corner'; S.hoverCorner = ci; }
  }

  // Update cursor — scale mode uses corner-aware diagonal cursors
  const curMap = {
    rotate: 'grab', move: 'move', north: 'grab',
    'layer-move': 'move', 'layer-rotate': 'grab',
    crop: 'crosshair', create: 'crosshair', mark: 'pointer',
  };
  const mode = S.dragMode || S.hoverMode;
  const cIdx = (S.dragMode === 'scale' || S.dragMode === 'crop-corner') ? S.dragCorner
    : ((S.hoverMode === 'scale' || S.hoverMode === 'crop-corner') ? S.hoverCorner : -1);
  if ((mode === 'scale' || mode === 'crop-corner') && cIdx >= 0) {
    // corners 0(BR) & 2(TL) = NW-SE axis; 1(BL) & 3(TR) = NE-SW axis
    els.canvas.style.cursor = [0,2].includes(cIdx) ? 'nwse-resize' : 'nesw-resize';
  } else if (S.cropMode && !S.dragMode) {
    els.canvas.style.cursor = 'crosshair';
  } else {
    els.canvas.style.cursor = curMap[mode] ||
      (S.step === 2 && S.sqW <= 0 && S.sqH <= 0 ? 'crosshair' : 'default');
  }

  // Drag actions
  if (!S.dragMode) { draw(); return; }

  if (S.dragMode === 'pan') {
    S.vx = S.dragState.vx + (pos.x - S.dragStart.x);
    S.vy = S.dragState.vy + (pos.y - S.dragStart.y);
  } else if (S.dragMode === 'move') {
    const dx = ip.x - S.dragStart.x;
    const dy = ip.y - S.dragStart.y;
    S.sqCx = S.dragState.cx + dx;
    S.sqCy = S.dragState.cy + dy;
  } else if (S.dragMode === 'rotate') {
    const dx = ip.x - S.sqCx;
    const dy = ip.y - S.sqCy;
    S.sqAngle = Math.atan2(dx, -dy);
  } else if (S.dragMode === 'scale') {
    // Free aspect ratio — opposite corner fixed, dragged corner follows cursor
    const opp = S.dragState.oppCorner;
    S.sqCx = (opp.x + ip.x) / 2;
    S.sqCy = (opp.y + ip.y) / 2;
    const angle = S.dragState.angle;
    const cos = Math.cos(-angle), sin = Math.sin(-angle);
    const dx = ip.x - opp.x;
    const dy = ip.y - opp.y;
    const lx = dx * cos - dy * sin;
    const ly = dx * sin + dy * cos;
    S.sqW = Math.max(20, Math.abs(lx));
    S.sqH = Math.max(20, Math.abs(ly));
  } else if (S.dragMode === 'create') {
    const dx = ip.x - S.dragStart.x;
    const dy = ip.y - S.dragStart.y;
    S.sqCx = S.dragStart.x + dx / 2;
    S.sqCy = S.dragStart.y + dy / 2;
    S.sqW = Math.max(20, Math.abs(dx));
    S.sqH = Math.max(20, Math.abs(dy));
    S.sqAngle = 0;
  } else if (S.dragMode === 'north') {
    const dx = ip.x - S.sqCx;
    const dy = ip.y - S.sqCy;
    if (Math.hypot(dx, dy) > 5/S.vScale) {
      S.northAngle = Math.atan2(dx, -dy);
    }
  } else if (S.dragMode === 'layer-move') {
    const L = S.copyLayer;
    L.cx = S.dragState.cx + (ip.x - S.dragStart.x);
    L.cy = S.dragState.cy + (ip.y - S.dragStart.y);
  } else if (S.dragMode === 'layer-rotate') {
    const L = S.copyLayer;
    const dx = ip.x - L.cx;
    const dy = ip.y - L.cy;
    L.angle = Math.atan2(dx, -dy);
    normalizeLayerAngle();
  } else if (S.dragMode === 'crop') {
    // 第三步：框选在图层局部坐标；第二步：原图坐标
    let a = S.dragStart, b = ip;
    let minX = 0, maxX = S.imgW, minY = 0, maxY = S.imgH;
    if (S.step === 3 && S.copyLayer) {
      b = imgToLayerLocal(ip.x, ip.y);
      const { w, h } = copyLayerSize();
      minX = -w / 2; maxX = w / 2; minY = -h / 2; maxY = h / 2;
    }
    const x0 = Math.max(minX, Math.min(maxX, Math.min(a.x, b.x)));
    const y0 = Math.max(minY, Math.min(maxY, Math.min(a.y, b.y)));
    const x1 = Math.max(minX, Math.min(maxX, Math.max(a.x, b.x)));
    const y1 = Math.max(minY, Math.min(maxY, Math.max(a.y, b.y)));
    S.cropRect = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
  } else if (S.dragMode === 'crop-corner') {
    let p = ip;
    let minX = 0, maxX = S.imgW, minY = 0, maxY = S.imgH;
    if (S.step === 3 && S.copyLayer) {
      p = imgToLayerLocal(ip.x, ip.y);
      const { w, h } = copyLayerSize();
      minX = -w / 2; maxX = w / 2; minY = -h / 2; maxY = h / 2;
    }
    const st = S.dragState;
    const cx = Math.max(minX, Math.min(maxX, p.x));
    const cy = Math.max(minY, Math.min(maxY, p.y));
    if (S.dragCorner === 0) { st.x1 = cx; st.y1 = cy; }
    else if (S.dragCorner === 1) { st.x0 = cx; st.y1 = cy; }
    else if (S.dragCorner === 2) { st.x0 = cx; st.y0 = cy; }
    else { st.x1 = cx; st.y0 = cy; }
    // 最小尺寸 12，拖过对面时停在最小尺寸
    if (st.x1 - st.x0 < 12) { if (S.dragCorner === 0 || S.dragCorner === 3) st.x1 = st.x0 + 12; else st.x0 = st.x1 - 12; }
    if (st.y1 - st.y0 < 12) { if (S.dragCorner === 0 || S.dragCorner === 1) st.y1 = st.y0 + 12; else st.y0 = st.y1 - 12; }
    S.cropRect = { x: st.x0, y: st.y0, w: st.x1 - st.x0, h: st.y1 - st.y0 };
  }

  draw();
});

els.canvas.addEventListener('mouseup', e => {
  if (S.dragMode === 'crop' || S.dragMode === 'crop-corner') {
    const r = S.cropRect;
    if (!r || r.w < 12 || r.h < 12) S.cropRect = null;
    S.dragMode = null;
    S.dragCorner = -1;
    updateSidebar();
    return;
  }
  if (S.dragMode === 'create' && (S.sqW > 30 || S.sqH > 30)) {
    // Square created successfully
    toast('✅ 范围已划定，拖拽角落缩放、顶部圆点旋转、中心拖拽移动');
  }
  S.dragMode = null;
  S.dragCorner = -1;
  updateSidebar();
});

els.canvas.addEventListener('mouseleave', () => {
  S.dragMode = null;
  S.dragCorner = -1;
  S.hoverMode = null;
  S.hoverCorner = -1;
  draw();
  updateSidebar();
});

els.canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (!S.img) return;
  const pos = getPos(e);
  const ip = canvas2img(pos.x, pos.y);

  const zoomFactor = e.deltaY < 0 ? 1.12 : 1/1.12;
  const newScale = Math.max(0.1, Math.min(8, S.vScale * zoomFactor));

  // Zoom centered on cursor
  S.vx = pos.x - ip.x * newScale;
  S.vy = pos.y - ip.y * newScale;
  S.vScale = newScale;

  draw();
}, {passive: false});

els.canvas.addEventListener('contextmenu', e => e.preventDefault());

// ── Keyboard ──
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.cropMode) { cancelCropMode(); return; }
  // 第三步有复制图层时：方向键=微移图层，[/]=微旋图层，-/==缩放（Shift 加大步幅）
  const layerActive = !!(S.step === 3 && S.copyLayer && S.copyLayer.visible && !e.ctrlKey && !S.cropMode);
  if (layerActive) {
    const stepPx = e.shiftKey ? 10 : 1;
    const stepDeg = e.shiftKey ? 10 : 1;
    const stepScale = e.shiftKey ? 1.5 : 1.1;
    if (e.key === 'ArrowLeft') { S.copyLayer.cx -= stepPx; draw(); updateLayerDisplays(); }
    else if (e.key === 'ArrowRight') { S.copyLayer.cx += stepPx; draw(); updateLayerDisplays(); }
    else if (e.key === 'ArrowUp') { S.copyLayer.cy -= stepPx; draw(); updateLayerDisplays(); }
    else if (e.key === 'ArrowDown') { S.copyLayer.cy += stepPx; draw(); updateLayerDisplays(); }
    else if (e.key === '[') { S.copyLayer.angle -= stepDeg * Math.PI / 180; normalizeLayerAngle(); draw(); updateLayerDisplays(); }
    else if (e.key === ']') { S.copyLayer.angle += stepDeg * Math.PI / 180; normalizeLayerAngle(); draw(); updateLayerDisplays(); }
    else if (e.key === '-') { S.copyLayer.scale = Math.max(0.1, S.copyLayer.scale / stepScale); draw(); updateLayerDisplays(); }
    else if (e.key === '=') { S.copyLayer.scale = Math.min(20, S.copyLayer.scale * stepScale); draw(); updateLayerDisplays(); }
    return;
  }
  if (S.step >= 2 && (S.sqW > 0 || S.sqH > 0)) {
    const step = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowLeft') { S.sqCx -= step; draw(); }
    if (e.key === 'ArrowRight') { S.sqCx += step; draw(); }
    if (e.key === 'ArrowUp') { S.sqCy -= step; draw(); }
    if (e.key === 'ArrowDown') { S.sqCy += step; draw(); }
    if (e.key === '[' || e.key === '-') { const d=step*2; S.sqW=Math.max(20,S.sqW-d); S.sqH=Math.max(20,S.sqH-d); draw(); updateSidebar(); }
    if (e.key === ']' || e.key === '=') { S.sqW+=step*2; S.sqH+=step*2; draw(); updateSidebar(); }
  }
  if (S.step >= 3) {
    if (e.key === 'ArrowLeft' && e.ctrlKey) { S.northAngle -= Math.PI/180; normalizeNorth(); draw(); updateNorthDisplay(); }
    if (e.key === 'ArrowRight' && e.ctrlKey) { S.northAngle += Math.PI/180; normalizeNorth(); draw(); updateNorthDisplay(); }
  }
});

function normalizeNorth() {
  while (S.northAngle > Math.PI) S.northAngle -= 2*Math.PI;
  while (S.northAngle < -Math.PI) S.northAngle += 2*Math.PI;
}

// ═══════════════════════════════════════
//  UPLOAD
// ═══════════════════════════════════════
els.uploadBox.addEventListener('click', () => els.fileInput.click());

els.fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) loadImage(file);
});

// Drag & drop
els.canvas.addEventListener('dragover', e => { e.preventDefault(); });
els.canvas.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && (file.type === 'image/jpeg' || file.type === 'image/png')) {
    loadImage(file);
  }
});
els.wrap.addEventListener('dragover', e => { e.preventDefault(); });
els.wrap.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && (file.type === 'image/jpeg' || file.type === 'image/png')) {
    loadImage(file);
  }
});

// Upload overlay itself also accepts drag & drop (it covers the canvas on step 1)
els.uploadOverlay.addEventListener('dragover', e => { e.preventDefault(); });
els.uploadOverlay.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file && (file.type === 'image/jpeg' || file.type === 'image/png')) {
    loadImage(file);
  }
});

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      S.img = img;
      S.imgW = img.naturalWidth;
      S.imgH = img.naturalHeight;
      S.imgBlob = file;
      S.thumb = '';
      S.autosaveImageStored = false;
      S.uploadOverlayShown = false;
      S.step = 2;
      S.sqW = 0; S.sqH = 0;
      S.sqAngle = 0;
      S.northAngle = 0;
      S.gridScale = 1.0;
      S.overlayTransparency = 0.9;
      S.compassTransparency = 0.1;
      S.copyLayer = null;
      S.cropMode = false;
      S.cropRect = null;
      S.imgTrans = { crop: null, angle: 0 };
      S.markedMountains.clear();
      fitImage();
      draw();
      updateUI();
      makeThumbnail().then(t => { S.thumb = t; scheduleAutosave(); });
      toast('📐 请在户型图上点击并拖动，划定户型主体范围');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ═══════════════════════════════════════
//  STEP MANAGEMENT
// ═══════════════════════════════════════
function goToStep(s) {
  S.step = Math.max(2, Math.min(6, s));
  S.dragMode = null;
  S.hoverMode = null;
  S.hoverCorner = -1;
  S.cropMode = false;
  S.cropRect = null;
  updateUI();
  draw();
}

// ═══════════════════════════════════════
//  STEP DOTS — DIRECT NAVIGATION
// ═══════════════════════════════════════
function jumpToStep(n) {
  if (n === 1) {
    // 上传页：已有进度时以遮罩形式唤出，可取消返回
    if (S.img) { S.uploadOverlayShown = true; updateUI(); }
    return;
  }
  if (n === 2 && !S.img) { toast('📐 请先上传户型图'); return; }
  if (n >= 3 && (S.sqW <= 0 || S.sqH <= 0)) { toast('⚠️ 请先划定户型范围'); return; }
  S.uploadOverlayShown = false;
  goToStep(n);
}

function cancelUpload() {
  S.uploadOverlayShown = false;
  updateUI();
}

// ═══════════════════════════════════════
//  LOCAL PERSISTENCE (IndexedDB)
//   records: {id, name, savedAt, step, state, thumb, auto}
//   images:  {id, blob} — floor-plan image per record
// ═══════════════════════════════════════
const DB_NAME = 'fengshui-app-db';
const DB_VERSION = 1;
const AUTOSAVE_ID = '__autosave__';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('records')) d.createObjectStore('records', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('images')) d.createObjectStore('images', { keyPath: 'id' });
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}
function idbPut(store, val) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(val);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
function idbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const rq = tx.objectStore(store).get(key);
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}
function idbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const rq = tx.objectStore(store).getAll();
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}
function idbDelete(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function collectState() {
  return {
    imgW: S.imgW, imgH: S.imgH,
    sqCx: S.sqCx, sqCy: S.sqCy, sqW: S.sqW, sqH: S.sqH,
    sqAngle: S.sqAngle, northAngle: S.northAngle,
    gridScale: S.gridScale,
    overlayTransparency: S.overlayTransparency,
    compassTransparency: S.compassTransparency,
    copyLayer: S.copyLayer ? { ...S.copyLayer, crop: S.copyLayer.crop ? { ...S.copyLayer.crop } : null } : null,
    imgTrans: { crop: S.imgTrans.crop ? { ...S.imgTrans.crop } : null, angle: S.imgTrans.angle ?? 0 },
    markedMountains: [...S.markedMountains],
  };
}

function restoreState(st) {
  if (!st) return;
  S.sqCx = st.sqCx ?? 0; S.sqCy = st.sqCy ?? 0;
  S.sqW = st.sqW ?? 0; S.sqH = st.sqH ?? 0;
  S.sqAngle = st.sqAngle ?? 0;
  S.northAngle = st.northAngle ?? 0;
  S.gridScale = st.gridScale ?? 1.0;
  S.overlayTransparency = st.overlayTransparency ?? 0.9;
  S.compassTransparency = st.compassTransparency ?? 0.1;
  S.copyLayer = st.copyLayer ? { ...st.copyLayer } : null;
  S.imgTrans = st.imgTrans ? { crop: st.imgTrans.crop ? { ...st.imgTrans.crop } : null, angle: st.imgTrans.angle ?? 0 } : { crop: null, angle: 0 };
  S.markedMountains = new Set(st.markedMountains || []);
}

// ── Autosave (single rolling record; resumes on reopen) ──
let autosaveTimer = null;
function scheduleAutosave() {
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(saveAutosave, 500);
}
async function saveAutosave() {
  if (!S.img || !db) return;
  try {
    // Image blob only needs writing once per session (state is small JSON)
    if (!S.autosaveImageStored && S.imgBlob) {
      await idbPut('images', { id: AUTOSAVE_ID, blob: S.imgBlob });
      S.autosaveImageStored = true;
    }
    await idbPut('records', {
      id: AUTOSAVE_ID, name: '最近进度', savedAt: Date.now(),
      step: S.step, state: collectState(), thumb: S.thumb || '', auto: true,
    });
    // 若第一步侧栏正在展示历史列表，刷新（自动保存可能刚创建新记录）
    if (document.getElementById('sidebar-history')) refreshHistory();
  } catch (e) { /* 自动保存失败不影响使用 */ }
}

// ── Explicit snapshot ──
async function saveSnapshot() {
  if (!db) { toast('❌ 当前浏览器不支持本地存档'); return; }
  if (!S.img) { toast('📐 请先上传户型图再保存'); return; }
  const def = `户型 ${fmtDate(Date.now()).slice(0, 10)} · 第${S.step}步`;
  const name = prompt('📁 存档名称：', def);
  if (name === null) return;
  const id = 'rec_' + Date.now();
  try {
    const thumb = S.thumb || await makeThumbnail();
    await idbPut('images', { id, blob: S.imgBlob });
    await idbPut('records', {
      id, name: name.trim() || def, savedAt: Date.now(),
      step: S.step, state: collectState(), thumb, auto: false,
    });
    refreshHistory();
    toast('✅ 已保存存档');
  } catch (e) {
    toast('❌ 保存失败：' + e);
  }
}

function makeThumbnail() {
  return new Promise(resolve => {
    try {
      const T = S.imgTrans;
      const cw = T.crop ? T.crop.sw : S.imgW;
      const ch = T.crop ? T.crop.sh : S.imgH;
      const w = 160, h = Math.max(1, Math.round(160 * ch / cw));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      if (T.crop) g.drawImage(S.img, T.crop.sx, T.crop.sy, T.crop.sw, T.crop.sh, 0, 0, w, h);
      else g.drawImage(S.img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.72));
    } catch (e) { resolve(''); }
  });
}

// ── Load / manage records ──
async function loadRecord(id) {
  const rec = await idbGet('records', id).catch(() => null);
  if (!rec) { toast('❌ 存档不存在'); return; }
  const imgRec = await idbGet('images', id).catch(() => null);
  if (!imgRec || !imgRec.blob) { toast('❌ 存档图片缺失'); return; }
  const url = URL.createObjectURL(imgRec.blob);
  const img = new Image();
  img.onload = () => {
    S.img = img;
    S.imgW = img.naturalWidth;
    S.imgH = img.naturalHeight;
    S.imgBlob = imgRec.blob;
    S.thumb = rec.thumb || '';
    S.autosaveImageStored = false;
    restoreState(rec.state);
    S.step = Math.max(2, Math.min(6, rec.step || 2));
    if (S.step >= 3 && (S.sqW <= 0 || S.sqH <= 0)) S.step = 2; // 前置条件校验
    S.dragMode = null; S.hoverMode = null; S.hoverCorner = -1;
    S.uploadOverlayShown = false;
    fitImage();
    draw();
    updateUI();
    hideHistoryModal();
    if (!S.thumb) makeThumbnail().then(t => { S.thumb = t; scheduleAutosave(); });
    scheduleAutosave();
    toast(`📂 已载入「${rec.name}」`);
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('❌ 图片加载失败'); };
  img.src = url;
}

async function deleteRecord(id) {
  const rec = await idbGet('records', id).catch(() => null);
  if (!rec) return;
  const label = rec.auto ? '自动保存的最近进度' : `存档「${rec.name}」`;
  if (!confirm(`确定删除${label}？此操作不可恢复。`)) return;
  await idbDelete('records', id);
  await idbDelete('images', id);
  refreshHistory();
  toast('🗑 已删除');
}

async function renameRecord(id) {
  const rec = await idbGet('records', id).catch(() => null);
  if (!rec) return;
  const name = prompt('✏️ 重命名存档：', rec.name);
  if (name === null || !name.trim()) return;
  rec.name = name.trim();
  await idbPut('records', rec);
  refreshHistory();
}

async function renderHistory() {
  renderHistoryInto(document.getElementById('history-list'));
}
async function renderHistoryInto(list) {
  if (!list) return;
  if (!db) {
    list.innerHTML = `<p class="hist-empty">当前浏览器不支持本地存档（IndexedDB 不可用）</p>`;
    return;
  }
  const recs = (await idbGetAll('records')).sort((a, b) => b.savedAt - a.savedAt);
  if (!recs.length) {
    list.innerHTML = `<p class="hist-empty">暂无存档。完成分析后点击右上角 💾 保存；<br>未保存的进度也会自动留存（🔁 自动保存）。</p>`;
    return;
  }
  list.innerHTML = recs.map(rec => `
    <div class="hist-item">
      ${rec.thumb
        ? `<img class="hist-thumb" src="${rec.thumb}" alt="">`
        : `<div class="hist-thumb hist-thumb-empty"></div>`}
      <div class="hist-info">
        <div class="hist-name">${rec.auto ? '🔁 ' : ''}${escapeHtml(rec.name)}</div>
        <div class="hist-meta">${fmtDate(rec.savedAt)} · 第 ${rec.step} 步${rec.auto ? ' · 自动保存' : ''}</div>
        <div class="hist-actions">
          <button class="primary" onclick="loadRecord('${rec.id}')">📂 载入</button>
          ${rec.auto ? '' : `<button class="secondary" onclick="renameRecord('${rec.id}')">✏️ 重命名</button>`}
          <button class="secondary danger" onclick="deleteRecord('${rec.id}')">🗑 删除</button>
        </div>
      </div>
    </div>`).join('');
}

// 同时刷新弹窗与侧栏两个历史列表
function refreshHistory() {
  renderHistory();
  const sh = document.getElementById('sidebar-history');
  if (sh) renderHistoryInto(sh);
}

function showHistoryModal() {
  renderHistory();
  document.getElementById('history-modal').style.display = 'flex';
}
function hideHistoryModal() {
  document.getElementById('history-modal').style.display = 'none';
}
function startNewAnalysis() {
  if (S.img && !confirm('开始新分析？当前进度将被替换（已保存的存档不受影响）。')) return;
  hideHistoryModal();
  S.uploadOverlayShown = true;
  updateUI();
}

function fmtDate(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function updateUI() {
  // Step dots
  for (let i = 0; i < 6; i++) {
    els.stepDots[i].className = 'step-dot' +
      (S.step === i + 1 ? ' active' : '') +
      (S.step > i + 1 ? ' done' : '');
    if (i < 5) els.stepLines[i].className = 'step-line' + (S.step > i + 1 ? ' done' : '');
  }

  // Upload overlay (step 1, or explicitly invoked via step-dot 1)
  els.uploadOverlay.style.display = (S.step === 1 || S.uploadOverlayShown) ? 'flex' : 'none';
  // 已有进度时完全遮住当前图，只显示上传界面
  els.uploadOverlay.classList.toggle('opaque', !!(S.uploadOverlayShown && S.img));
  els.uploadCancel.style.display = (S.uploadOverlayShown && S.img) ? 'inline-block' : 'none';

  updateSidebar();
}

// ── Sidebar button actions ──
function copyPNG() {
  const c = els.canvas;
  c.toBlob(blob => {
    if (!blob) { toast('❌ 生成图片失败'); return; }
    navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(() => {
      toast('✅ PNG已复制到剪贴板');
    }).catch(() => {
      toast('❌ 复制失败，请重试');
    });
  }, 'image/png');
}

function resetSquare() {
  S.sqW = 0; S.sqH = 0;
  S.sqAngle = 0;
  S.sqCx = S.imgW / 2;
  S.sqCy = S.imgH / 2;
  S.gridScale = 0.5;
  S.overlayTransparency = 0.9;
  S.markedMountains.clear();
  S.dragMode = null;
  draw();
  updateSidebar();
  toast('🔄 请在图上重新拖动划定范围');
}

function nudgeNorth(d) {
  S.northAngle += d * Math.PI / 180;
  normalizeNorth();
  draw();
  updateNorthDisplay();
}

function setNorthDeg(v) {
  const deg = parseInt(v) || 0;
  S.northAngle = deg * Math.PI / 180;
  normalizeNorth();
  draw();
  updateNorthDisplay();
}

function updateNorthDisplay() {
  const absDeg = ((Math.round(S.northAngle * 180 / Math.PI) % 360) + 360) % 360;
  const dirName = absDeg <= 1 || absDeg >= 359 ? '正北' :
    absDeg < 90 ? `北偏东 ${absDeg}°` :
    absDeg === 90 ? '正东' :
    absDeg < 180 ? `东偏南 ${absDeg-90}°` :
    absDeg === 180 ? '正南' :
    absDeg < 270 ? `南偏西 ${absDeg-180}°` :
    absDeg === 270 ? '正西' :
    `北偏西 ${360-absDeg}°`;
  const dirEl = document.getElementById('north-dir-name');
  const degEl = document.getElementById('north-deg-display');
  const inputEl = document.getElementById('north-deg');
  const sliderEl = document.querySelector('#sidebar input[type=range]');
  if (dirEl) dirEl.textContent = dirName;
  if (degEl) degEl.textContent = absDeg + '°';
  if (inputEl) inputEl.value = absDeg;
  if (sliderEl) sliderEl.value = absDeg;
  updateLayerDisplays();
}

function setGridScale(v) {
  S.gridScale = parseInt(v) / 100;
  if (S.step >= 4) {
    draw();
    // Direct DOM update — avoids destroying slider during drag
    const display = document.getElementById('grid-scale-display');
    if (display) display.textContent = Math.round(S.gridScale * 100) + '%';
  }
}

function setOverlayTransparency(v) {
  S.overlayTransparency = parseInt(v) / 100;
  draw();
  // Direct DOM update — avoids destroying slider during drag
  const display = document.getElementById('overlay-transparency-display');
  if (display) display.textContent = Math.round(S.overlayTransparency * 100) + '%';
}

function setCompassTransparency(v) {

function toggleMark(bi) {
